       地面为票面棕红，内容直接落在其上；栏线取纸白低透明。
       与站内 :root 的 --band / --on-band 同值。 -->
  <rect width="1200" height="630" fill="#8C3A1E"/>

  <!-- 双线收口 -->
  <rect x="56" y="56" width="1088" height="518" fill="none" stroke="#FDFCF9" stroke-opacity="0.34" stroke-width="1"/>
  <rect x="64" y="64" width="1072" height="502" fill="none" stroke="#FDFCF9" stroke-opacity="0.18" stroke-width="1"/>

